name: Refresh LEGO sources

# The catalog is Rebrickable-derived and the OMR/seymouria indexes are scraped;
# all three are rebuilt at deploy time, so they only ever get as fresh as the
# last push to main. This job rebuilds them weekly and pushes the result, which
# in turn triggers deploy.yml — so a set released this week is searchable next
# Monday without anyone running anything.
#
# It also measures the gap the catalog refresh CANNOT close: the model index is
# generated in the clego repo from a local 1.8 GB corpus, so a brand-new set is
# searchable but has no model (the 40975-1 report). scripts/source-freshness.ts
# reports how many sourceless sets a KNOWN channel (DBIX skulist / LDraw OMR)
# could supply TODAY, and the committed source-freshness.json is the work list
# for the local harvest documented in clego/discovery/README.md.

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      # Rebuild every bundled data file that has an upstream. lego-catalog.json
      # is gitignored (regenerated at deploy), the two indexes are tracked.
      - name: Rebuild catalog + OMR + seymouria indexes
        run: |
          bun run prebuild:lego
          bun run prebuild:omr
          bun run prebuild:seymouria

      # Live probe: which sourceless sets could a known channel supply now?
      - name: Measure model-source freshness
        run: bun scripts/source-freshness.ts

      # Guard: a scrape that silently returns an empty list must not be
      # committed over a good index.
      - name: Sanity-check the regenerated indexes
        run: |
          node -e "
            const fs = require('fs');
            const omr = JSON.parse(fs.readFileSync('web/public/omr-index.json','utf8'));
            if (!Array.isArray(omr) || omr.length < 1000) { console.error('omr-index.json too small: ' + omr.length); process.exit(1); }
            const cat = JSON.parse(fs.readFileSync('web/public/lego-catalog.json','utf8'));
            if (!cat.sets || cat.sets.length < 20000) { console.error('lego-catalog.json too small'); process.exit(1); }
            console.log('ok: omr ' + omr.length + ' sets, catalog ' + cat.sets.length + ' sets');
          "

      # source-freshness.json carries a timestamp, so this commits every week
      # BY DESIGN: lego-catalog.json is gitignored and rebuilt at deploy time,
      # so the only way a fresh Rebrickable catalog reaches prod is a push that
      # triggers deploy.yml. The weekly commit is that trigger.
      - name: Commit and push (triggers deploy)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/omr-index.json web/public/seymouria-index.json web/public/source-freshness.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(data): weekly refresh of the LEGO source indexes

          Regenerated by .github/workflows/refresh-sources.yml (Rebrickable
          catalog, LDraw OMR index, seymouria index) plus the model-source
          freshness report. Pushing to main redeploys with the fresh catalog.'
          git push
