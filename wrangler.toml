name = "ldraw-omr-proxy"
main = "worker/ldraw-omr.js"
compatibility_date = "2024-11-01"

[[routes]]
pattern = "craftmatic.click/ldraw-omr/*"
zone_name = "craftmatic.click"

# BrickLink Studio BFF inventory (server-side anonymous token) and the
# seymouria .ldr mirror. The worker has handled both since it was written, but
# their routes lived only in the Cloudflare DASHBOARD — and were not in effect:
# measured 2026-09-02, craftmatic.click/bff/inventory/21063-1 fell through to
# GitHub Pages and returned its 404 page, so the LEGO tab's LAST-RESORT source
# (the flat colour layout, and the only thing a brand-new set can fall back to)
# was dead in production while working in dev. Declared here so a dashboard
# edit cannot silently drop them again.
[[routes]]
pattern = "craftmatic.click/bff/*"
zone_name = "craftmatic.click"

[[routes]]
pattern = "craftmatic.click/seymouria-ldr/*"
zone_name = "craftmatic.click"

# Parts library proxy — makes the 3D direct renderer work in production by
# serving individual LDraw .dat geometry from library.ldraw.org (the parts
# library is otherwise dev-only). Without this route the deployed app has no
# brick geometry and falls back to voxelization.
[[routes]]
pattern = "craftmatic.click/ldraw-parts/*"
zone_name = "craftmatic.click"

# Model corpus + index, same-origin (2026-08-29): serving these through the
# worker instead of the raw pub-*.r2.dev domain gets edge gzip/brotli (the
# 2.4 MB index was shipping uncompressed) plus edge caching. The batch parts
# endpoint (/ldraw-parts/_batch) rides the existing /ldraw-parts/* route.
[[routes]]
pattern = "craftmatic.click/lego-models/*"
zone_name = "craftmatic.click"

[[routes]]
pattern = "craftmatic.click/lego-models-index.json"
zone_name = "craftmatic.click"

# Self-hosted LDraw library (keys ldraw/<relpath>) in the same R2 bucket as
# the model corpus. The worker serves parts R2-first — library.ldraw.org
# rate-limits cold big-set bursts (prod incident 2026-08-17), so upstream is
# only a fallback for keys the sync hasn't covered.
[[r2_buckets]]
binding = "MODELS"
bucket_name = "lego-models"
